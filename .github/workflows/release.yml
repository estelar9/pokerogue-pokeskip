name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate syntax (lint)
        run: |
          npm run lint

      - name: Build extension zip
        run: |
          cd extension
          zip -r ../pokeskip-extension.zip ./*
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PokéSkip ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            pokeskip-extension.zip
            pokeskip.user.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
