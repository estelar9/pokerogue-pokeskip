name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Validate syntax & build (lint)
        run: npm run lint

      - name: Build extension zip
        run: |
          cd extension
          zip -r ../pokeskip-extension.zip ./*
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PokéSkip ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            pokeskip-extension.zip
            pokeskip.user.js
            pokeskip.roguetop.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package source code for Mozilla review
        run: |
          mkdir -p web-ext-artifacts
          zip -r source-code.zip src/ package.json package-lock.json build.js README.md CHANGELOG.md LICENSE -x "node_modules/*"

      - name: Deploy to Firefox Add-ons (AMO)
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        continue-on-error: true
        uses: kewisch/action-web-ext@v2
        with:
          cmd: sign
          source: pokeskip-extension.zip
          apiKey: ${{ secrets.AMO_JWT_ISSUER }}
          apiSecret: ${{ secrets.AMO_JWT_SECRET }}
          channel: ${{ secrets.AMO_CHANNEL || 'listed' }}
          sourceCode: source-code.zip
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      - name: Deploy to Microsoft Edge Add-ons
        if: env.EDGE_PRODUCT_ID != '' && env.EDGE_CLIENT_ID != '' && env.EDGE_API_KEY != ''
        continue-on-error: true
        uses: wdzeng/edge-addon@v2
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_API_KEY }}
          zip-path: pokeskip-extension.zip
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}

      - name: Deploy to Chrome Web Store
        if: env.CHROME_EXTENSION_ID != '' && env.CHROME_CLIENT_ID != '' && env.CHROME_CLIENT_SECRET != '' && env.CHROME_REFRESH_TOKEN != ''
        continue-on-error: true
        uses: mnao305/chrome-extension-upload@v7.0.0
        with:
          file-path: pokeskip-extension.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
