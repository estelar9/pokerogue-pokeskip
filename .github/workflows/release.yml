name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Validate syntax & build (lint)
        run: npm run lint

      - name: Build extension zip
        run: |
          cd extension
          zip -r ../pokeskip-extension.zip ./*
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PokéSkip ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            pokeskip-extension.zip
            pokeskip.user.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package source code for Mozilla review
        run: |
          zip -r source-code.zip src/ package.json package-lock.json build.js README.md LICENSE -x "node_modules/*"

      - name: Deploy to Firefox Add-ons (AMO)
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        uses: kewisch/action-web-ext@v2
        with:
          cmd: sign
          source: extension
          apiKey: ${{ secrets.AMO_JWT_ISSUER }}
          apiSecret: ${{ secrets.AMO_JWT_SECRET }}
          channel: ${{ secrets.AMO_CHANNEL || 'listed' }}
          sourceCode: source-code.zip
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
